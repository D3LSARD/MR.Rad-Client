name: Build Real MR.Rad VPN APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Clone VPN Client Base
      run: |
        git clone --depth 1 https://github.com/2dust/v2rayNG.git source_code

    - name: Customize App Name and Package ID
      run: |
        cd source_code
        # تغییر پکیج‌نیم به com.mrrad.app
        find . -type f \( -name "build.gradle" -o -name "*.kt" -o -name "*.java" -o -name "AndroidManifest.xml" \) -exec sed -i 's/com\.v2ray\.ang/com.mrrad.app/g' {} + || true
        
        # تغییر نام اپلیکیشن به MR.Rad
        sed -i 's/<string name="app_name">v2rayNG<\/string>/<string name="app_name">MR.Rad<\/string>/g' app/src/main/res/values/strings.xml || true
        echo "Customization applied successfully!"

    - name: Build APK with Gradle
      run: |
        cd source_code
        chmod +x gradlew
        ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug

    - name: Collect APK Files
      run: |
        mkdir -p ../build-output
        find source_code -name "*.apk" -exec cp {} ../build-output/ \;

    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MR.Rad-Real-APK
        path: ../build-output/
